services:
  billing-test-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wondertale_billing_test
      POSTGRES_USER: billing_test
      POSTGRES_PASSWORD: local_billing_test_only
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billing_test -d wondertale_billing_test"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: "no"
