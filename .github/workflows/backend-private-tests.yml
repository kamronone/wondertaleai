name: WonderTale private backend tests

on:
  push:
    branches:
      - fix/private-book-access
    paths:
      - 'backend/**'
      - '.github/workflows/backend-private-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secure-api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Test private API without external providers
        run: python -m pytest -q test_generated_book_library.py
        env:
          APP_ENV: development
          REQUIRE_EMAIL_VERIFICATION: 'false'
          ENABLE_TEXT_AI: 'true'
          ENABLE_REGISTRATION: 'true'
