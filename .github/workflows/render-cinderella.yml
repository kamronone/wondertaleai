name: Render Cinderella review films
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    if: github.ref == 'refs/heads/fix/private-book-access'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install edge-tts==7.2.7
      - name: Render review videos
        run: python frontend/scripts/build-cinderella-film.py
      - name: Verify outputs
        run: |
          set -eu
          cd frontend/cartoon-build/cinderella
          for lang in ru uz en; do
            test -s "film-$lang.mp4"
            test -s "$lang.vtt"
            grep -q '^WEBVTT' "$lang.vtt"
            ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "film-$lang.mp4" | grep -qx h264
            ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of csv=p=0 "film-$lang.mp4" | grep -qx aac
          done
      - uses: actions/upload-artifact@v4
        with:
          name: cinderella-review-films
          path: frontend/cartoon-build/cinderella/
          if-no-files-found: error
          retention-days: 7
