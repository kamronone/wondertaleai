<svg xmlns="http://www.w3.org/2000/svg" width="240" height="174" viewBox="0 0 240 174" role="img" aria-labelledby="title desc">
<title id="title">Красный глиняный кирпич</title>
<desc id="desc">Акварельный красный кирпич с фактурой глины, боковой гранью и мягкой тенью.</desc>
<defs>
  <linearGradient id="top" x1=".08" y1=".1" x2=".92" y2=".95">
    <stop offset="0" stop-color="#efac87"/><stop offset=".27" stop-color="#cd7557"/><stop offset=".72" stop-color="#ad4e3d"/><stop offset="1" stop-color="#894036"/>
  </linearGradient>
  <linearGradient id="front" x1=".18" y1="0" x2=".88" y2="1">
    <stop offset="0" stop-color="#bc6349"/><stop offset=".53" stop-color="#a94b3d"/><stop offset="1" stop-color="#76352f"/>
  </linearGradient>
  <linearGradient id="right" x1="0" y1=".2" x2="1" y2=".9">
    <stop offset="0" stop-color="#a74a39"/><stop offset="1" stop-color="#682c29"/>
  </linearGradient>
  <filter id="soft" x="-30%" y="-50%" width="160%" height="200%">
    <feGaussianBlur stdDeviation="6"/>
  </filter>
  <filter id="grit" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".12" numOctaves="3" stitchTiles="stitch" seed="8" result="noise"/>
    <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
    <feComponentTransfer in="mono" result="grain"><feFuncA type="linear" slope=".19"/></feComponentTransfer>
    <feBlend in="SourceGraphic" in2="grain" mode="multiply"/>
  </filter>
</defs>
<ellipse cx="119" cy="153" rx="104" ry="13" fill="#4b2324" opacity=".25" filter="url(#soft)"/>
<g stroke="#743b30" stroke-width="2.6" stroke-linejoin="round" filter="url(#grit)">
